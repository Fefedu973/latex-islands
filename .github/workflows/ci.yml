name: Validate, package and release

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Check the default branch daily, including browser updates between releases.
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record the hosted Chromium version
        run: google-chrome --version
      - name: Verify pinned TeX dependencies offline
        run: node scripts/vendor-tex-packages.mjs --check
      - run: npm test
      - name: Compile real TeX fixtures offline
        run: npm run test:engine
        timeout-minutes: 3
      - name: Verify first diagram paint with delayed fonts
        run: npm run test:fonts
        timeout-minutes: 1
      - name: Verify rich PDF layout and diagram snapshots in Chromium
        run: npm run test:pdf
        timeout-minutes: 4
      - name: Ensure native-print test system tools are available
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y xvfb xauth poppler-utils
          fi
      - name: Verify native Save as PDF and repeated preview restoration
        run: xvfb-run -a npm run test:pdf:native
        timeout-minutes: 5
      - name: Verify navigation and repair prompts in the actual Chrome extension
        run: npm run test:chrome
        timeout-minutes: 4
      - run: npm run build
      - name: Verify reproducible archives
        run: |
          cp dist/SHA256SUMS "$RUNNER_TEMP/latex-islands-SHA256SUMS"
          npm run build
          diff "$RUNNER_TEMP/latex-islands-SHA256SUMS" dist/SHA256SUMS
      - run: npm run lint:firefox
      - name: Check ZIP structure with the system reader
        run: |
          unzip -t dist/latex-islands-chrome-*.zip
          unzip -t dist/latex-islands-firefox-*.zip
          unzip -t dist/latex-islands-source-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: latex-islands-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic browser evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          # Fresh runner, explicit test-output names. Never collect a browser
          # profile, real conversation, source tree, HAR, or auth/session data.
          path: |
            tests/engine-fixtures/pdf-*.png
            tests/engine-fixtures/pdf-*.pdf
            tests/engine-fixtures/pdf-*.json
            tests/engine-fixtures/chatgpt-*.png
            tests/engine-fixtures/chromium-extension-navigation*.json
          if-no-files-found: ignore
          retention-days: 7

  public-chatgpt:
    name: Public ChatGPT DOM contract (not authenticated end-to-end coverage)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the configured public synthetic conversation
        env:
          CHATGPT_SMOKE_URL: ${{ vars.CHATGPT_SMOKE_URL }}
        run: node scripts/check-public-chatgpt.mjs
      - name: Retain counts and coverage status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-chatgpt-coverage
          path: tests/engine-fixtures/public-chatgpt-report.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag and notes
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, accessSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error('package.json must contain a valid release version.');
          }
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}.`);
          }
          accessSync(`docs/release-${version}.md`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: latex-islands-packages
          path: release-assets
      - name: Verify validated package checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/latex-islands-chrome-$RELEASE_VERSION.zip" \
            "release-assets/latex-islands-firefox-$RELEASE_VERSION.zip" \
            "release-assets/latex-islands-source-$RELEASE_VERSION.zip" \
            release-assets/SHA256SUMS \
            --verify-tag --draft \
            --title "LaTeX Islands $RELEASE_VERSION" \
            --notes-file "docs/release-$RELEASE_VERSION.md"
          gh release edit "$RELEASE_TAG" --draft=false
