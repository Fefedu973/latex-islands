<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schéma TikZ</title><link rel="stylesheet" href="vendor/tikzjax/fonts.css"><link rel="stylesheet" href="island.css"></head>
<body><main class="island" data-state="idle">
<header class="editor-header"><button id="close-editor" class="icon-button" type="button" aria-label="Fermer l’éditeur" title="Fermer l’éditeur" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><button id="source-toggle" class="text-button" type="button" aria-expanded="true" aria-controls="source-details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14m14-7H9m4-4-4 4 4 4"/></svg><span>Masquer le code</span></button><span class="header-spacer"></span><button id="copy-header" class="icon-button" type="button" aria-label="Copier le code" title="Copier le code" ><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="13" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h8a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2h-2"/></svg></button><button id="png-header" class="icon-button" type="button" aria-label="Télécharger le PNG" title="Télécharger le PNG" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button></header>
<div class="workspace">
<section id="source-details" class="source-pane" aria-label="Éditeur du code TikZ" hidden><label class="sr-only" for="source">Code TikZ</label><textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="60000"></textarea><div class="source-actions"><span id="edit-hint">⌘ / Ctrl + Entrée pour actualiser</span><button id="compile" class="text-button" type="button">Actualiser</button></div></section>
<section class="preview-pane" aria-label="Aperçu du schéma">
<div id="viewport" tabindex="0" aria-label="Schéma interactif. Glisser pour déplacer, plus et moins pour zoomer, zéro pour ajuster."><div id="output" role="img" aria-label="Schéma TikZ"></div><div id="placeholder"><span id="spinner" class="spinner" aria-hidden="true" hidden></span><span id="status" role="status" aria-live="polite">Schéma prêt à afficher</span><button id="render-manual" class="text-button" type="button" hidden>Afficher le schéma</button></div></div>
<div class="floating-tools"><div class="zoom-controls" role="group" aria-label="Zoom du schéma"><button id="zoom-out" class="icon-button" type="button" aria-label="Réduire" title="Réduire" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button><span class="zoom-divider"></span><button id="zoom-in" class="icon-button" type="button" aria-label="Agrandir" title="Agrandir" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button></div><button id="menu-toggle" class="icon-button menu-toggle" type="button" aria-label="Options du schéma" title="Options du schéma" aria-haspopup="menu" aria-expanded="false" aria-controls="diagram-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
<div id="diagram-menu" role="menu" hidden><button id="open-editor" type="button" role="menuitem">Ouvrir l’éditeur</button><button id="reset-zoom" type="button" role="menuitem" disabled>Ajuster le schéma</button><div class="menu-divider" role="separator"></div><button id="download-png" type="button" role="menuitem" disabled>Télécharger le PNG</button><button id="download" type="button" role="menuitem" disabled>Télécharger le SVG</button><button id="copy-source" type="button" role="menuitem">Copier le code</button></div></div>
<div id="error" role="alert" hidden></div><div id="error-actions" hidden><button id="retry" class="text-button" type="button">Réessayer</button><button id="error-source" class="text-button" type="button">Afficher le code</button></div><p id="warning" hidden></p><span id="announcement" class="sr-only" role="status" aria-live="polite"></span>
</section></div></main><script src="core.js"></script><script src="compiler.js"></script><script src="island.js"></script></body></html>
