<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor · LaTeX Islands</title>
  <link rel="stylesheet" href="ui.css">
  <script src="native-controls.js" defer></script>
  <script src="examples.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body class="demo-page">
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 5-5 7 5 7m10-14 5 7-5 7M14 3l-4 18"/></svg></span><span class="brand-name">LaTeX Islands</span><span class="brand-divider" aria-hidden="true">/</span><h1>Editor</h1></div>
    <div class="header-actions"><label class="visually-hidden" for="uiTheme">Editor appearance</label><select id="uiTheme" class="theme-select"><option value="chatgpt">ChatGPT</option><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  </header>
  <main class="demo-main">
    <div class="workspace-toolbar">
      <button id="toggle-source" class="button text-button" type="button" aria-expanded="true" aria-controls="source-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg><span>Hide code</span></button>
      <div class="example-control"><label class="visually-hidden" for="example">Choose a diagram example</label><select id="example"></select></div>
      <span class="toolbar-spacer"></span>
      <span class="shortcut" aria-hidden="true"><kbd>Ctrl</kbd> <kbd>↵</kbd></span>
      <button class="button primary" type="button" id="render"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7V5Z"/></svg><span>Compile</span></button>
    </div>
    <div class="workspace" id="workspace">
      <section class="source-panel panel" id="source-panel" aria-labelledby="source-heading">
        <header class="panel-heading"><h2 id="source-heading">Code <span class="language-badge">LaTeX</span></h2><button id="copy-source" class="icon-button" type="button" title="Copy code" aria-label="Copy code"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="3"/><path d="M16 8V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h2"/></svg></button></header>
        <label class="visually-hidden" for="source">LaTeX diagram code</label><textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="source-status" placeholder="Paste TikZ code here…"></textarea>
        <footer class="panel-footer"><span id="source-status" role="status" aria-live="polite"></span><span id="source-count"></span></footer>
      </section>
      <section class="preview-panel panel" aria-labelledby="preview-heading">
        <header class="panel-heading"><h2 id="preview-heading">Preview</h2><div class="preview-heading-actions"><span id="render-status" role="status" aria-live="polite">Ready to compile</span><button id="expand-preview" class="icon-button" type="button" disabled title="Open full screen" aria-label="Open preview full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M9 9 3 3m12 6 6-6M9 15l-6 6m12-6 6 6"/></svg></button></div></header>
        <div class="preview-area" id="preview"><div class="preview-empty"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m6 16 4-5 4 3 4-6"/></svg><p>Your diagram will appear here</p><span>Paste code or choose an example.</span></div></div>
        <footer class="panel-footer preview-footer"><div class="color-control"><label class="visually-hidden" for="renderColors">Diagram colors</label><select id="renderColors"><option value="chatgpt">Match theme</option><option value="native">LaTeX colors · white background</option></select></div></footer>
      </section>
    </div>
  </main>
</body>
</html>
